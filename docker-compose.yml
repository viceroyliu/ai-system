services:
  ai-sync:
    image: python:3.11-slim
    container_name: ai-sync
    ports:
      - "5100:5100"
    volumes:
      - /Users/viceroy/ai-system:/app
    working_dir: /app
    environment:
      - TZ=Asia/Shanghai
    command: >
      bash -c "
        pip install -q 'notion-client>=2.2.0' chromadb pyyaml flask requests &&
        python /app/sync/sync_service.py
      "
    restart: unless-stopped
